name: Android Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: rattlegram-cn-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report-${{ github.sha }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Rattlegram CN build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Java: ${JAVA_VERSION}"
            echo "- Gradle: $(./gradlew --version | awk '/^Gradle / { print $2 }')"
            find app/build/outputs/apk -name '*.apk' -type f -printf '- `%p`\n' 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
